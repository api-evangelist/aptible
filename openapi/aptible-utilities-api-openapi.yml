openapi: 3.2.0
info:
  title: Cloud Utilities API
  version: 0.1.0
servers:
- url: /
tags:
- name: utilities
paths:
  /api/v1/debug/user_auth:
    get:
      operationId: get_user
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      security:
      - HTTPBearer: []
      summary: Get User
      tags:
      - utilities
  /api/v1/debug/user_role_middleware_check:
    get:
      operationId: get_user_role
      parameters:
      - explode: true
        in: query
        name: organization_id
        required: true
        schema:
          format: uuid
          title: Organization Id
          type: string
        style: form
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Get User Role
      tags:
      - utilities
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    Location_inner:
      anyOf:
      - type: string
      - type: integer
    ValidationError:
      properties:
        loc:
          items:
            $ref: '#/components/schemas/Location_inner'
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
  securitySchemes:
    HTTPBearer:
      scheme: bearer
      type: http
