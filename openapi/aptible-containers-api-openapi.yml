openapi: 3.2.0
info:
  contact:
    email: support@aptible.com
  description: REST API for the core Aptible platform.
  title: Aptible API v1 Containers API
  version: v1
servers:
- url: '{baseUrl}'
  variables:
    baseUrl:
      default: https://api.aptible.com
      description: Override for local or test environments
security:
- token: []
tags:
- name: Containers
paths:
  /releases/{release_id}/containers:
    get:
      description: Returns a paginated list of containers for the specified release.
      operationId: ListContainersForRelease
      parameters:
      - description: release_id
        explode: false
        in: path
        name: release_id
        required: true
        schema:
          type: integer
        style: simple
      - description: Current page of paginated results
        explode: true
        in: query
        name: page
        required: false
        schema:
          type: integer
        style: form
      - description: Number of results to return per page
        explode: true
        in: query
        name: per_page
        required: false
        schema:
          type: integer
        style: form
      - description: 'When true, omits embedded resources from the response. Also triggered when the Prefer: no_sensitive_extras=true header is present.'
        explode: true
        in: query
        name: no_embed
        required: false
        schema:
          type: boolean
        style: form
      - description: When set to no_sensitive_extras=true, omits sensitive fields and embedded resources from the response.
        explode: false
        in: header
        name: Prefer
        required: false
        schema:
          enum:
          - no_sensitive_extras=true
          type: string
        style: simple
      responses:
        '200':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ListContainersForRelease_200_response'
          description: successful
        default:
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/error'
          description: Error response. Often a 4xx or 5xx status code
      summary: list containers
      tags:
      - Containers
  /containers/{id}:
    get:
      description: Returns the details of a specific container by ID.
      operationId: GetContainer
      parameters:
      - description: id
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: integer
        style: simple
      - description: 'When true, omits embedded resources from the response. Also triggered when the Prefer: no_sensitive_extras=true header is present.'
        explode: true
        in: query
        name: no_embed
        required: false
        schema:
          type: boolean
        style: form
      - description: When set to no_sensitive_extras=true, omits sensitive fields and embedded resources from the response.
        explode: false
        in: header
        name: Prefer
        required: false
        schema:
          enum:
          - no_sensitive_extras=true
          type: string
        style: simple
      responses:
        '200':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/container'
          description: successful
        default:
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/error'
          description: Error response. Often a 4xx or 5xx status code
      summary: show container
      tags:
      - Containers
  /log_drains/{log_drain_id}/containers:
    get:
      description: Returns a paginated list of containers for the specified log drain.
      operationId: ListContainersForLogDrain
      parameters:
      - description: log_drain_id
        explode: false
        in: path
        name: log_drain_id
        required: true
        schema:
          type: integer
        style: simple
      - description: Current page of paginated results
        explode: true
        in: query
        name: page
        required: false
        schema:
          type: integer
        style: form
      - description: Number of results to return per page
        explode: true
        in: query
        name: per_page
        required: false
        schema:
          type: integer
        style: form
      - description: 'When true, omits embedded resources from the response. Also triggered when the Prefer: no_sensitive_extras=true header is present.'
        explode: true
        in: query
        name: no_embed
        required: false
        schema:
          type: boolean
        style: form
      - description: When set to no_sensitive_extras=true, omits sensitive fields and embedded resources from the response.
        explode: false
        in: header
        name: Prefer
        required: false
        schema:
          enum:
          - no_sensitive_extras=true
          type: string
        style: simple
      responses:
        '200':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ListContainersForRelease_200_response'
          description: successful
        default:
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/error'
          description: Error response. Often a 4xx or 5xx status code
      summary: list containers
      tags:
      - Containers
  /metric_drains/{metric_drain_id}/containers:
    get:
      description: Returns a paginated list of containers for the specified metric drain.
      operationId: ListContainersForMetricDrain
      parameters:
      - description: metric_drain_id
        explode: false
        in: path
        name: metric_drain_id
        required: true
        schema:
          type: integer
        style: simple
      - description: Current page of paginated results
        explode: true
        in: query
        name: page
        required: false
        schema:
          type: integer
        style: form
      - description: Number of results to return per page
        explode: true
        in: query
        name: per_page
        required: false
        schema:
          type: integer
        style: form
      - description: 'When true, omits embedded resources from the response. Also triggered when the Prefer: no_sensitive_extras=true header is present.'
        explode: true
        in: query
        name: no_embed
        required: false
        schema:
          type: boolean
        style: form
      - description: When set to no_sensitive_extras=true, omits sensitive fields and embedded resources from the response.
        explode: false
        in: header
        name: Prefer
        required: false
        schema:
          enum:
          - no_sensitive_extras=true
          type: string
        style: simple
      responses:
        '200':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ListContainersForRelease_200_response'
          description: successful
        default:
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/error'
          description: Error response. Often a 4xx or 5xx status code
      summary: list containers
      tags:
      - Containers
components:
  schemas:
    error:
      properties:
        code:
          type: integer
        error:
          type: string
        message:
          type: string
      required:
      - code
      - error
      - message
      type: object
    ListContainersForRelease_200_response:
      properties:
        _embedded:
          $ref: '#/components/schemas/ListContainersForRelease_200_response__embedded'
        total_count:
          type: integer
        per_page:
          type: integer
        current_page:
          type: integer
        _links:
          $ref: '#/components/schemas/ListContainersForRelease_200_response__links'
      required:
      - _embedded
      - _links
      - current_page
      - per_page
      - total_count
      type: object
    ListContainersForRelease_200_response__links:
      properties:
        release:
          $ref: '#/components/schemas/ListAccountsForStack_200_response__links_stack'
        log_drain:
          $ref: '#/components/schemas/ListAccountsForStack_200_response__links_stack'
        next:
          $ref: '#/components/schemas/ListAccountsForStack_200_response__links_stack'
        prev:
          $ref: '#/components/schemas/ListAccountsForStack_200_response__links_stack'
        self:
          $ref: '#/components/schemas/ListAccountsForStack_200_response__links_stack'
      type: object
    container__links:
      properties:
        release:
          $ref: '#/components/schemas/ListAccountsForStack_200_response__links_stack'
        vhost:
          $ref: '#/components/schemas/ListAccountsForStack_200_response__links_stack'
        log_drain:
          $ref: '#/components/schemas/ListAccountsForStack_200_response__links_stack'
        metric_drain:
          $ref: '#/components/schemas/ListAccountsForStack_200_response__links_stack'
        self:
          $ref: '#/components/schemas/ListAccountsForStack_200_response__links_stack'
      type: object
    container:
      properties:
        id:
          type: integer
        host:
          type: string
        port:
          type: integer
        status:
          type: string
        docker_name:
          type: string
          x-nullable: true
        _type:
          type: string
        created_at:
          format: dateTime
          type: string
        updated_at:
          format: dateTime
          type: string
        layer:
          type: string
        aws_instance_id:
          type: string
          x-nullable: true
        instance_class:
          type: string
          x-nullable: true
        memory_limit:
          type: integer
        port_mapping:
          items:
            items:
              type: integer
            type: array
          type: array
        allocation:
          items:
            type: string
          type: array
        mounts:
          items:
            items:
              type: string
            type: array
          type: array
        _links:
          $ref: '#/components/schemas/container__links'
      required:
      - _type
      - allocation
      - aws_instance_id
      - created_at
      - docker_name
      - host
      - id
      - instance_class
      - layer
      - memory_limit
      - mounts
      - port
      - port_mapping
      - status
      - updated_at
    ListContainersForRelease_200_response__embedded:
      properties:
        containers:
          items:
            $ref: '#/components/schemas/container'
          type: array
      type: object
    ListAccountsForStack_200_response__links_stack:
      properties:
        href:
          format: uri
          type: string
      type: object
  securitySchemes:
    token:
      in: header
      name: Authorization
      type: apiKey
