openapi: 3.2.0
info:
  contact:
    email: support@aptible.com
  description: REST API for the core Aptible platform.
  title: Aptible API v1 Persistent Disks API
  version: v1
servers:
- url: '{baseUrl}'
  variables:
    baseUrl:
      default: https://api.aptible.com
      description: Override for local or test environments
security:
- token: []
tags:
- name: PersistentDisks
paths:
  /accounts/{account_id}/persistent_disks:
    get:
      description: Returns a paginated list of persistent disks for the specified account.
      operationId: ListPersistentDisksForAccount
      parameters:
      - description: account_id
        explode: false
        in: path
        name: account_id
        required: true
        schema:
          type: integer
        style: simple
      - description: Current page of paginated results
        explode: true
        in: query
        name: page
        required: false
        schema:
          type: integer
        style: form
      - description: Number of results to return per page
        explode: true
        in: query
        name: per_page
        required: false
        schema:
          type: integer
        style: form
      - description: 'When true, omits embedded resources from the response. Also triggered when the Prefer: no_sensitive_extras=true header is present.'
        explode: true
        in: query
        name: no_embed
        required: false
        schema:
          type: boolean
        style: form
      - description: When set to no_sensitive_extras=true, omits sensitive fields and embedded resources from the response.
        explode: false
        in: header
        name: Prefer
        required: false
        schema:
          enum:
          - no_sensitive_extras=true
          type: string
        style: simple
      responses:
        '200':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ListPersistentDisksForAccount_200_response'
          description: successful
        default:
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/error'
          description: Error response. Often a 4xx or 5xx status code
      summary: list persistent disks
      tags:
      - PersistentDisks
  /persistent_disks/{id}:
    get:
      description: Returns the details of a specific persistent disk by ID.
      operationId: GetPersistentDisk
      parameters:
      - description: id
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: integer
        style: simple
      - description: 'When true, omits embedded resources from the response. Also triggered when the Prefer: no_sensitive_extras=true header is present.'
        explode: true
        in: query
        name: no_embed
        required: false
        schema:
          type: boolean
        style: form
      - description: When set to no_sensitive_extras=true, omits sensitive fields and embedded resources from the response.
        explode: false
        in: header
        name: Prefer
        required: false
        schema:
          enum:
          - no_sensitive_extras=true
          type: string
        style: simple
      responses:
        '200':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/persistent_disk'
          description: successful
        default:
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/error'
          description: Error response. Often a 4xx or 5xx status code
      summary: show persistent disk
      tags:
      - PersistentDisks
components:
  schemas:
    error:
      properties:
        code:
          type: integer
        error:
          type: string
        message:
          type: string
      required:
      - code
      - error
      - message
      type: object
    persistent_disk__links:
      properties:
        account:
          $ref: '#/components/schemas/ListAccountsForStack_200_response__links_stack'
        operations:
          $ref: '#/components/schemas/ListAccountsForStack_200_response__links_stack'
        self:
          $ref: '#/components/schemas/ListAccountsForStack_200_response__links_stack'
      type: object
    ListPersistentDisksForAccount_200_response__embedded:
      properties:
        persistent_disks:
          items:
            $ref: '#/components/schemas/persistent_disk'
          type: array
      type: object
    ListActivityReportsForAccount_200_response__links:
      properties:
        account:
          $ref: '#/components/schemas/ListAccountsForStack_200_response__links_stack'
        next:
          $ref: '#/components/schemas/ListAccountsForStack_200_response__links_stack'
        prev:
          $ref: '#/components/schemas/ListAccountsForStack_200_response__links_stack'
        self:
          $ref: '#/components/schemas/ListAccountsForStack_200_response__links_stack'
      type: object
    ListPersistentDisksForAccount_200_response:
      properties:
        _embedded:
          $ref: '#/components/schemas/ListPersistentDisksForAccount_200_response__embedded'
        total_count:
          type: integer
        per_page:
          type: integer
        current_page:
          type: integer
        _links:
          $ref: '#/components/schemas/ListActivityReportsForAccount_200_response__links'
      required:
      - _embedded
      - _links
      - current_page
      - per_page
      - total_count
      type: object
    ListAccountsForStack_200_response__links_stack:
      properties:
        href:
          format: uri
          type: string
      type: object
    persistent_disk:
      properties:
        _type:
          type: string
        id:
          type: integer
        handle:
          type: string
        status:
          type: string
        disk_type:
          type: string
        size:
          type: integer
        provisioned_iops:
          type: integer
        disk_status:
          type: string
          x-nullable: true
        aws_resource_id:
          type: string
          x-nullable: true
        kms_arn:
          type: string
          x-nullable: true
        modification_progress:
          type: integer
          x-nullable: true
        availability_zone:
          type: string
          x-nullable: true
        formatted:
          type: boolean
        created_at:
          format: dateTime
          type: string
        updated_at:
          format: dateTime
          type: string
        modified_at:
          format: dateTime
          type: string
          x-nullable: true
        deleted_at:
          format: dateTime
          type: string
          x-nullable: true
        _links:
          $ref: '#/components/schemas/persistent_disk__links'
      required:
      - _type
      - availability_zone
      - aws_resource_id
      - created_at
      - deleted_at
      - disk_status
      - disk_type
      - formatted
      - handle
      - id
      - kms_arn
      - modification_progress
      - modified_at
      - provisioned_iops
      - size
      - status
      - updated_at
  securitySchemes:
    token:
      in: header
      name: Authorization
      type: apiKey
