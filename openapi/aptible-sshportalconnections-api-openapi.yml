openapi: 3.2.0
info:
  contact:
    email: support@aptible.com
  description: REST API for the core Aptible platform.
  title: Aptible API v1 Ssh Portal Connections API
  version: v1
servers:
- url: '{baseUrl}'
  variables:
    baseUrl:
      default: https://api.aptible.com
      description: Override for local or test environments
security:
- token: []
tags:
- name: SshPortalConnections
paths:
  /operations/{operation_id}/ssh_portal_connections:
    get:
      description: Returns a paginated list of SSH portal connections for the specified operation.
      operationId: ListSshPortalConnectionsForOperation
      parameters:
      - description: operation_id
        explode: false
        in: path
        name: operation_id
        required: true
        schema:
          type: integer
        style: simple
      - description: Current page of paginated results
        explode: true
        in: query
        name: page
        required: false
        schema:
          type: integer
        style: form
      - description: Number of results to return per page
        explode: true
        in: query
        name: per_page
        required: false
        schema:
          type: integer
        style: form
      - description: 'When true, omits embedded resources from the response. Also triggered when the Prefer: no_sensitive_extras=true header is present.'
        explode: true
        in: query
        name: no_embed
        required: false
        schema:
          type: boolean
        style: form
      - description: When set to no_sensitive_extras=true, omits sensitive fields and embedded resources from the response.
        explode: false
        in: header
        name: Prefer
        required: false
        schema:
          enum:
          - no_sensitive_extras=true
          type: string
        style: simple
      responses:
        '200':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ListSshPortalConnectionsForOperation_200_response'
          description: successful
        default:
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/error'
          description: Error response. Often a 4xx or 5xx status code
      summary: list ssh_portal_connections
      tags:
      - SshPortalConnections
    post:
      description: Creates a new SSH portal connection for the specified operation.
      operationId: CreateSshPortalConnection
      parameters:
      - description: operation_id
        explode: false
        in: path
        name: operation_id
        required: true
        schema:
          type: integer
        style: simple
      - description: 'When true, omits embedded resources from the response. Also triggered when the Prefer: no_sensitive_extras=true header is present.'
        explode: true
        in: query
        name: no_embed
        required: false
        schema:
          type: boolean
        style: form
      - description: When set to no_sensitive_extras=true, omits sensitive fields and embedded resources from the response.
        explode: false
        in: header
        name: Prefer
        required: false
        schema:
          enum:
          - no_sensitive_extras=true
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSshPortalConnection_request'
      responses:
        '201':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ssh_portal_connection'
          description: successful
        default:
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/error'
          description: Error response. Often a 4xx or 5xx status code
      summary: create ssh_portal_connection
      tags:
      - SshPortalConnections
  /ssh_portal_connections/{id}:
    get:
      description: Returns the details of a specific SSH portal connection by ID.
      operationId: GetSshPortalConnection
      parameters:
      - description: id
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: integer
        style: simple
      - description: 'When true, omits embedded resources from the response. Also triggered when the Prefer: no_sensitive_extras=true header is present.'
        explode: true
        in: query
        name: no_embed
        required: false
        schema:
          type: boolean
        style: form
      - description: When set to no_sensitive_extras=true, omits sensitive fields and embedded resources from the response.
        explode: false
        in: header
        name: Prefer
        required: false
        schema:
          enum:
          - no_sensitive_extras=true
          type: string
        style: simple
      responses:
        '200':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ssh_portal_connection'
          description: successful
        default:
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/error'
          description: Error response. Often a 4xx or 5xx status code
      summary: show ssh_portal_connection
      tags:
      - SshPortalConnections
components:
  schemas:
    ssh_portal_connection__links:
      properties:
        operation:
          $ref: '#/components/schemas/ListAccountsForStack_200_response__links_stack'
        self:
          $ref: '#/components/schemas/ListAccountsForStack_200_response__links_stack'
      type: object
    ListSshPortalConnectionsForOperation_200_response__embedded:
      properties:
        ssh_portal_connections:
          items:
            $ref: '#/components/schemas/ssh_portal_connection'
          type: array
      type: object
    error:
      properties:
        code:
          type: integer
        error:
          type: string
        message:
          type: string
      required:
      - code
      - error
      - message
      type: object
    ssh_portal_connection:
      properties:
        id:
          format: uuid
          type: string
        _type:
          type: string
        ssh_user:
          type: string
        ssh_certificate_body:
          type: string
        ssh_port_forward_socket:
          type: string
          x-nullable: true
        ssh_pty:
          type: boolean
        created_at:
          format: dateTime
          type: string
        updated_at:
          format: dateTime
          type: string
        _links:
          $ref: '#/components/schemas/ssh_portal_connection__links'
      required:
      - _type
      - created_at
      - id
      - ssh_certificate_body
      - ssh_port_forward_socket
      - ssh_pty
      - ssh_user
      - updated_at
    CreateSshPortalConnection_request:
      properties:
        ssh_public_key:
          type: string
        command:
          type: string
      required:
      - ssh_public_key
      type: object
    ListDatabaseImages_200_response__links:
      properties:
        next:
          $ref: '#/components/schemas/ListAccountsForStack_200_response__links_stack'
        prev:
          $ref: '#/components/schemas/ListAccountsForStack_200_response__links_stack'
        self:
          $ref: '#/components/schemas/ListAccountsForStack_200_response__links_stack'
      type: object
    ListSshPortalConnectionsForOperation_200_response:
      properties:
        _embedded:
          $ref: '#/components/schemas/ListSshPortalConnectionsForOperation_200_response__embedded'
        total_count:
          type: integer
        per_page:
          type: integer
        current_page:
          type: integer
        _links:
          $ref: '#/components/schemas/ListDatabaseImages_200_response__links'
      required:
      - _embedded
      - _links
      - current_page
      - per_page
      - total_count
      type: object
    ListAccountsForStack_200_response__links_stack:
      properties:
        href:
          format: uri
          type: string
      type: object
  securitySchemes:
    token:
      in: header
      name: Authorization
      type: apiKey
