components:
  schemas:
    CreateSettingForApp_request:
      properties:
        settings:
          description: Mapping of non-sensitive key-value pairs
          type: object
        sensitive_settings:
          description: Mapping of sensitive key-value pairs
          type: object
      type: object
    ListSettingsForApp_200_response__embedded:
      properties:
        settings:
          items:
            $ref: '#/components/schemas/setting'
          type: array
      type: object
    error:
      properties:
        code:
          type: integer
        error:
          type: string
        message:
          type: string
      required:
      - code
      - error
      - message
      type: object
    ListCodeScanResultsForApp_200_response__links:
      properties:
        resource:
          $ref: '#/components/schemas/ListAccountsForStack_200_response__links_stack'
        next:
          $ref: '#/components/schemas/ListAccountsForStack_200_response__links_stack'
        prev:
          $ref: '#/components/schemas/ListAccountsForStack_200_response__links_stack'
        self:
          $ref: '#/components/schemas/ListAccountsForStack_200_response__links_stack'
      type: object
    configuration__links:
      properties:
        resource:
          $ref: '#/components/schemas/ListAccountsForStack_200_response__links_stack'
        self:
          $ref: '#/components/schemas/ListAccountsForStack_200_response__links_stack'
      type: object
    ListSettingsForApp_200_response:
      properties:
        _embedded:
          $ref: '#/components/schemas/ListSettingsForApp_200_response__embedded'
        total_count:
          type: integer
        per_page:
          type: integer
        current_page:
          type: integer
        _links:
          $ref: '#/components/schemas/ListCodeScanResultsForApp_200_response__links'
      required:
      - _embedded
      - _links
      - current_page
      - per_page
      - total_count
      type: object
    setting:
      properties:
        id:
          type: integer
        _type:
          type: string
        settings:
          type: object
        sensitive_settings:
          type: object
        _links:
          $ref: '#/components/schemas/configuration__links'
      required:
      - _type
      - id
      - settings
    ListAccountsForStack_200_response__links_stack:
      properties:
        href:
          format: uri
          type: string
      type: object
  securitySchemes:
    token:
      in: header
      name: Authorization
      type: apiKey
