openapi: 3.2.0
info:
  contact:
    email: support@aptible.com
  description: REST API for the core Aptible platform.
  title: Aptible API v1 Ephemeral Containers API
  version: v1
servers:
- url: '{baseUrl}'
  variables:
    baseUrl:
      default: https://api.aptible.com
      description: Override for local or test environments
security:
- token: []
tags:
- name: EphemeralContainers
paths:
  /ephemeral_sessions/{ephemeral_session_id}/ephemeral_containers:
    get:
      description: Returns a paginated list of ephemeral containers for the specified ephemeral session.
      operationId: ListEphemeralContainersForEphemeralSession
      parameters:
      - description: ephemeral_session_id
        explode: false
        in: path
        name: ephemeral_session_id
        required: true
        schema:
          type: integer
        style: simple
      - description: Current page of paginated results
        explode: true
        in: query
        name: page
        required: false
        schema:
          type: integer
        style: form
      - description: Number of results to return per page
        explode: true
        in: query
        name: per_page
        required: false
        schema:
          type: integer
        style: form
      - description: 'When true, omits embedded resources from the response. Also triggered when the Prefer: no_sensitive_extras=true header is present.'
        explode: true
        in: query
        name: no_embed
        required: false
        schema:
          type: boolean
        style: form
      - description: When set to no_sensitive_extras=true, omits sensitive fields and embedded resources from the response.
        explode: false
        in: header
        name: Prefer
        required: false
        schema:
          enum:
          - no_sensitive_extras=true
          type: string
        style: simple
      responses:
        '200':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ListEphemeralContainersForEphemeralSession_200_response'
          description: successful
        default:
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/error'
          description: Error response. Often a 4xx or 5xx status code
      summary: list ephemeral_containers
      tags:
      - EphemeralContainers
  /ephemeral_containers/{id}:
    get:
      description: Returns the details of a specific ephemeral container by ID.
      operationId: GetEphemeralContainer
      parameters:
      - description: id
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: integer
        style: simple
      - description: 'When true, omits embedded resources from the response. Also triggered when the Prefer: no_sensitive_extras=true header is present.'
        explode: true
        in: query
        name: no_embed
        required: false
        schema:
          type: boolean
        style: form
      - description: When set to no_sensitive_extras=true, omits sensitive fields and embedded resources from the response.
        explode: false
        in: header
        name: Prefer
        required: false
        schema:
          enum:
          - no_sensitive_extras=true
          type: string
        style: simple
      responses:
        '200':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ephemeral_container'
          description: successful
        default:
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/error'
          description: Error response. Often a 4xx or 5xx status code
      summary: show ephemeral_container
      tags:
      - EphemeralContainers
  /log_drains/{log_drain_id}/ephemeral_containers:
    get:
      description: Returns a paginated list of ephemeral containers for the specified log drain.
      operationId: ListEphemeralContainersForLogDrain
      parameters:
      - description: log_drain_id
        explode: false
        in: path
        name: log_drain_id
        required: true
        schema:
          type: integer
        style: simple
      - description: Current page of paginated results
        explode: true
        in: query
        name: page
        required: false
        schema:
          type: integer
        style: form
      - description: Number of results to return per page
        explode: true
        in: query
        name: per_page
        required: false
        schema:
          type: integer
        style: form
      - description: 'When true, omits embedded resources from the response. Also triggered when the Prefer: no_sensitive_extras=true header is present.'
        explode: true
        in: query
        name: no_embed
        required: false
        schema:
          type: boolean
        style: form
      - description: When set to no_sensitive_extras=true, omits sensitive fields and embedded resources from the response.
        explode: false
        in: header
        name: Prefer
        required: false
        schema:
          enum:
          - no_sensitive_extras=true
          type: string
        style: simple
      responses:
        '200':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ListEphemeralContainersForEphemeralSession_200_response'
          description: successful
        default:
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/error'
          description: Error response. Often a 4xx or 5xx status code
      summary: list ephemeral_containers
      tags:
      - EphemeralContainers
components:
  schemas:
    error:
      properties:
        code:
          type: integer
        error:
          type: string
        message:
          type: string
      required:
      - code
      - error
      - message
      type: object
    ListEphemeralContainersForEphemeralSession_200_response:
      properties:
        _embedded:
          $ref: '#/components/schemas/ListEphemeralContainersForEphemeralSession_200_response__embedded'
        total_count:
          type: integer
        per_page:
          type: integer
        current_page:
          type: integer
        _links:
          $ref: '#/components/schemas/ListEphemeralContainersForEphemeralSession_200_response__links'
      required:
      - _embedded
      - _links
      - current_page
      - per_page
      - total_count
      type: object
    ListEphemeralContainersForEphemeralSession_200_response__links:
      properties:
        ephemeral_session:
          $ref: '#/components/schemas/ListAccountsForStack_200_response__links_stack'
        log_drain:
          $ref: '#/components/schemas/ListAccountsForStack_200_response__links_stack'
        next:
          $ref: '#/components/schemas/ListAccountsForStack_200_response__links_stack'
        prev:
          $ref: '#/components/schemas/ListAccountsForStack_200_response__links_stack'
        self:
          $ref: '#/components/schemas/ListAccountsForStack_200_response__links_stack'
      type: object
    ephemeral_container__links:
      properties:
        ephemeral_session:
          $ref: '#/components/schemas/ListAccountsForStack_200_response__links_stack'
        log_drain:
          $ref: '#/components/schemas/ListAccountsForStack_200_response__links_stack'
        self:
          $ref: '#/components/schemas/ListAccountsForStack_200_response__links_stack'
      type: object
    ListEphemeralContainersForEphemeralSession_200_response__embedded:
      properties:
        ephemeral_containers:
          items:
            $ref: '#/components/schemas/ephemeral_container'
          type: array
      type: object
    ephemeral_container:
      properties:
        id:
          type: integer
        layer:
          type: string
        docker_name:
          type: string
        interactive:
          type: boolean
        memory_limit:
          type: integer
        allocation:
          items:
            type: string
          type: array
        created_at:
          format: dateTime
          type: string
        updated_at:
          format: dateTime
          type: string
        _type:
          type: string
        _links:
          $ref: '#/components/schemas/ephemeral_container__links'
      required:
      - _type
      - allocation
      - created_at
      - docker_name
      - id
      - interactive
      - layer
      - memory_limit
      - updated_at
    ListAccountsForStack_200_response__links_stack:
      properties:
        href:
          format: uri
          type: string
      type: object
  securitySchemes:
    token:
      in: header
      name: Authorization
      type: apiKey
