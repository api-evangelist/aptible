openapi: 3.2.0
info:
  contact:
    email: support@aptible.com
  description: REST API for the core Aptible platform.
  title: Aptible API v1 Vpn Tunnels API
  version: v1
servers:
- url: '{baseUrl}'
  variables:
    baseUrl:
      default: https://api.aptible.com
      description: Override for local or test environments
security:
- token: []
tags:
- name: VpnTunnels
paths:
  /stacks/{stack_id}/vpn_tunnels:
    get:
      description: Returns a paginated list of VPN tunnels belonging to the specified stack.
      operationId: ListVpnTunnelsForStack
      parameters:
      - description: stack_id
        explode: false
        in: path
        name: stack_id
        required: true
        schema:
          type: integer
        style: simple
      - description: Current page of paginated results
        explode: true
        in: query
        name: page
        required: false
        schema:
          type: integer
        style: form
      - description: Number of results to return per page
        explode: true
        in: query
        name: per_page
        required: false
        schema:
          type: integer
        style: form
      - description: 'When true, omits embedded resources from the response. Also triggered when the Prefer: no_sensitive_extras=true header is present.'
        explode: true
        in: query
        name: no_embed
        required: false
        schema:
          type: boolean
        style: form
      - description: When set to no_sensitive_extras=true, omits sensitive fields and embedded resources from the response.
        explode: false
        in: header
        name: Prefer
        required: false
        schema:
          enum:
          - no_sensitive_extras=true
          type: string
        style: simple
      responses:
        '200':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ListVpnTunnelsForStack_200_response'
          description: successful
        default:
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/error'
          description: Error response. Often a 4xx or 5xx status code
      summary: list vpn_tunnels
      tags:
      - VpnTunnels
  /vpn_tunnels/{id}:
    get:
      description: Returns the details of a specific VPN tunnel by ID.
      operationId: GetVpnTunnel
      parameters:
      - description: id
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: integer
        style: simple
      - description: 'When true, omits embedded resources from the response. Also triggered when the Prefer: no_sensitive_extras=true header is present.'
        explode: true
        in: query
        name: no_embed
        required: false
        schema:
          type: boolean
        style: form
      - description: When set to no_sensitive_extras=true, omits sensitive fields and embedded resources from the response.
        explode: false
        in: header
        name: Prefer
        required: false
        schema:
          enum:
          - no_sensitive_extras=true
          type: string
        style: simple
      responses:
        '200':
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/vpn_tunnel'
          description: successful
        default:
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/error'
          description: Error response. Often a 4xx or 5xx status code
      summary: show vpn_tunnel
      tags:
      - VpnTunnels
components:
  schemas:
    vpc_peer__links:
      properties:
        stack:
          $ref: '#/components/schemas/ListAccountsForStack_200_response__links_stack'
        self:
          $ref: '#/components/schemas/ListAccountsForStack_200_response__links_stack'
      type: object
    ListVpnTunnelsForStack_200_response:
      properties:
        _embedded:
          $ref: '#/components/schemas/ListVpnTunnelsForStack_200_response__embedded'
        total_count:
          type: integer
        per_page:
          type: integer
        current_page:
          type: integer
        _links:
          $ref: '#/components/schemas/ListAccountsForStack_200_response__links'
      required:
      - _embedded
      - _links
      - current_page
      - per_page
      - total_count
      type: object
    error:
      properties:
        code:
          type: integer
        error:
          type: string
        message:
          type: string
      required:
      - code
      - error
      - message
      type: object
    ListVpnTunnelsForStack_200_response__embedded:
      properties:
        vpn_tunnels:
          items:
            $ref: '#/components/schemas/vpn_tunnel'
          type: array
      type: object
    ListAccountsForStack_200_response__links:
      properties:
        stack:
          $ref: '#/components/schemas/ListAccountsForStack_200_response__links_stack'
        next:
          $ref: '#/components/schemas/ListAccountsForStack_200_response__links_stack'
        prev:
          $ref: '#/components/schemas/ListAccountsForStack_200_response__links_stack'
        self:
          $ref: '#/components/schemas/ListAccountsForStack_200_response__links_stack'
      type: object
    vpn_tunnel:
      properties:
        id:
          type: integer
        _type:
          type: string
        created_at:
          format: dateTime
          type: string
        updated_at:
          format: dateTime
          type: string
        handle:
          type: string
        phase_1_alg:
          type: string
          x-nullable: true
        phase_1_dh_group:
          type: integer
          x-nullable: true
        phase_1_lifetime:
          type: integer
          x-nullable: true
        phase_2_alg:
          type: string
          x-nullable: true
        phase_2_dh_group:
          type: integer
          x-nullable: true
        phase_2_lifetime:
          type: integer
          x-nullable: true
        perfect_forward_secrecy:
          type: boolean
          x-nullable: true
        our_gateway:
          type: string
          x-nullable: true
        our_networks:
          items:
            items:
              type: string
            type: array
          type: array
          x-nullable: true
        peer_gateway:
          type: string
          x-nullable: true
        peer_networks:
          items:
            items:
              type: string
            type: array
          type: array
          x-nullable: true
        _links:
          $ref: '#/components/schemas/vpc_peer__links'
      required:
      - _type
      - created_at
      - handle
      - id
      - our_gateway
      - our_networks
      - peer_gateway
      - peer_networks
      - perfect_forward_secrecy
      - phase_1_alg
      - phase_1_dh_group
      - phase_1_lifetime
      - phase_2_alg
      - phase_2_dh_group
      - phase_2_lifetime
      - updated_at
    ListAccountsForStack_200_response__links_stack:
      properties:
        href:
          format: uri
          type: string
      type: object
  securitySchemes:
    token:
      in: header
      name: Authorization
      type: apiKey
