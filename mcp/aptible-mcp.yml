  docs: https://www.aptible.com/docs/mcp-gateway
  connect_docs: https://www.aptible.com/docs/mcp-gateway/connect
  auth: bearer token (API key created in the Aptible dashboard under MCP > API Keys)
  tools: proxied
  note: This is a GOVERNANCE PROXY, not a server that exposes Aptible's own API as tools. It fronts a
    customer's registered upstream MCP servers, enforces per-tool grants (deny by default), and writes
    an audit log entry for every tool call. Its tool list is therefore tenant-specific.
