aid: aptible
name: Aptible
description: 'Aptible is a Platform as a Service (PaaS) built for teams that have to
  prove security and compliance, not just ship. It deploys web apps, managed databases
  (PostgreSQL, MySQL, Redis, Elasticsearch, InfluxDB, RabbitMQ, SFTP) and AI workloads
  onto isolated, dedicated AWS infrastructure with encryption, host hardening, DDoS
  protection, managed host intrusion detection and vulnerability scanning enforced
  by default. Aptible ships HIPAA Business Associate Agreements, HITRUST R2 inheritance,
  SOC 2, PCI DSS and PIPEDA support alongside a Security & Compliance Dashboard, and
  more recently an LLM Gateway (400+ models behind one compliant API, with audit logging,
  spend limits and model access policies) and an MCP Gateway that governs how teams
  and agents reach MCP servers. The platform is driven by a public HAL+JSON REST API
  at api.aptible.com, an auth service at auth.aptible.com, a Ruby CLI, a Terraform
  provider, and generated Go/Ruby/Python client libraries.'
image: https://framerusercontent.com/assets/sM8ECTApfoCzQMGmPJrKL9qxMFo.jpg
url: https://raw.githubusercontent.com/api-evangelist/aptible/refs/heads/main/apis.yml
