apis:
- aid: aptible:auth
  name: Aptible Auth API
  description: >-
    The Aptible authentication and identity service at auth.aptible.com. A HAL+JSON API exposing organizations,
    sessions, tokens, OAuth clients, users, U2F trusted facets and SSH key pre-authorizations, plus the
    RSA public key used to verify the JWTs it issues. This is where the bearer token consumed by the Deploy
    API comes from. No OpenAPI is published for this surface; the HAL root is the discovery document.
  humanURL: >-
    https://www.aptible.com/docs/core-concepts/security-compliance/authentication/password-authentication
  baseURL: https://auth.aptible.com
  tags:
  - Authentication
  - Identity
  - OAuth
  properties:
  - type: Documentation
    url: >-
      https://www.aptible.com/docs/core-concepts/security-compliance/authentication/password-authentication
