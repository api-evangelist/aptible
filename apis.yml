apis:
- aid: aptible:deploy
  name: Aptible Deploy API
  description: 'The core Aptible platform API. A HAL+JSON REST API covering accounts
    (environments), apps, databases, backups and retention policies, certificates,
    configurations, containers, disks, deployments, endpoints (vhosts), ephemeral SSH
    sessions and containers, images, log drains and metric drains, LLM Gateway configurations,
    LLM keys and policies, maintenances, operations, permissions, plans, releases,
    services and service sizing policies, sources, stacks, VPC peers and VPN tunnels.
    137 paths / 195 operations, every one tagged with a unique operationId. Authentication
    is a bearer token in the Authorization header, issued by auth.aptible.com.'
  humanURL: https://www.aptible.com/docs/getting-started/home
  baseURL: https://api.aptible.com
  tags:
  - Deployment
  - Platform as a Service
  - Managed Databases
  - Infrastructure
  properties:
  - type: OpenAPI
    url: openapi/aptible-deploy-openapi-original.yml
  - type: Overlay
    url: overlays/aptible-deploy-overlay.yaml
  - type: Documentation
    url: https://www.aptible.com/docs/getting-started/home
- aid: aptible:auth
  name: Aptible Auth API
  description: 'The Aptible authentication and identity service at auth.aptible.com.
    A HAL+JSON API exposing organizations, sessions, tokens, OAuth clients, users,
    U2F trusted facets and SSH key pre-authorizations, plus the RSA public key used
    to verify the JWTs it issues. This is where the bearer token consumed by the Deploy
    API comes from. No OpenAPI is published for this surface; the HAL root is the discovery
    document.'
  humanURL: https://www.aptible.com/docs/core-concepts/security-compliance/authentication/password-authentication
  baseURL: https://auth.aptible.com
  tags:
  - Authentication
  - Identity
  - OAuth
  properties:
  - type: Documentation
    url: https://www.aptible.com/docs/core-concepts/security-compliance/authentication/password-authentication
- aid: aptible:cloud
  name: Aptible Cloud API
  description: 'The Aptible Cloud API, published as an OpenAPI 3.0.2 document alongside
    the generated Go, Python and Ruby client libraries in aptible/cloud-api-clients.
    Covers organizations, environments, assets, connections, operations, actions,
    worker and utility endpoints — 19 paths / 28 operations, HTTP bearer auth. The
    published spec declares a relative server URL, so the deployment host is not
    asserted in the contract.'
  humanURL: https://github.com/aptible/cloud-api-clients
  baseURL: https://api.aptible.com
  tags:
  - Cloud
  - Infrastructure
  - Provisioning
  properties:
  - type: OpenAPI
    url: openapi/aptible-cloud-openapi-original.yml
  - type: Overlay
    url: overlays/aptible-cloud-overlay.yaml
  - type: SourceCode
    url: https://github.com/aptible/cloud-api-clients
- aid: aptible:tool-server
  name: Aptible Tool Server API
  description: 'A small OpenAPI 3.0.0 contract Aptible publishes for an Aptible tool
    server — list the tools a server exposes and invoke one by tool_id. Bearer token
    auth. Two operations; it is the contract behind the tool-execution layer that
    the MCP Gateway governs.'
  humanURL: https://github.com/aptible/tool-server-openapi-spec
  baseURL: https://www.aptible.com
  tags:
  - Tools
  - Agents
  - MCP
  properties:
  - type: OpenAPI
    url: openapi/aptible-tool-server-openapi-original.yml
  - type: SourceCode
    url: https://github.com/aptible/tool-server-openapi-spec
